# What this file is for: a scheduled GitHub Actions workflow that calls the live app (it runs no tests).
# When it is used: automatically every 15 minutes, or by hand with "Run workflow" in the GitHub Actions tab.
name: Dispatch & keep-alive

# One call does both jobs: it touches the database, clearing Supabase Free's ~7-day inactivity
# pause, and it retries pending webhook deliveries. Scheduled workflows can run late; deliveries
# are also attempted inline right after a practitioner's decision or a cancellation.
#
# Until the app is deployed and the APP_URL / DISPATCH_TOKEN repository secrets are set, every
# step is skipped, so the schedule never produces a failing run.

on:
  # Every 15 minutes, at minutes 7, 22, 37 and 52 of each hour. These minutes avoid the busy start of the
  # hour, when GitHub delays scheduled runs the most. Schedules run from `main` only, and GitHub may still
  # start a run a few minutes late. Each run takes seconds; GitHub Actions is free for a public repository.
  # A failed delivery is retried only when it is due (30 s, 60 s, 120 s ... after the last try), so
  # running more often does not use up its tries faster; it only means a due retry waits at most 15 minutes.
  schedule:
    - cron: "7,22,37,52 * * * *"
  # Adds a "Run workflow" button so the same job can be started by hand.
  workflow_dispatch:

# The workflow needs no access to the repository at all; it only calls the app over HTTPS.
permissions: {}

jobs:
  # The only job: check the app is healthy, then ask it to send waiting webhook deliveries.
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Repository secrets (Settings > Secrets and variables > Actions). GitHub hides their values in logs.
    env:
      APP_URL: ${{ secrets.APP_URL }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
    steps:
      # Only runs while a secret is missing: print a note and finish green instead of failing.
      - name: Not configured yet
        if: env.APP_URL == '' || env.DISPATCH_TOKEN == ''
        run: echo "APP_URL and DISPATCH_TOKEN secrets are not set - skipping."
      # GET /api/v1/health also runs a database query, which counts as activity for Supabase.
      # `--fail` makes the step (and the run) fail if the app answers 503 (database down) or any error.
      - name: Health
        if: env.APP_URL != '' && env.DISPATCH_TOKEN != ''
        run: curl --fail --silent --show-error "$APP_URL/api/v1/health"
      # POST to the protected dispatch endpoint with DISPATCH_TOKEN as a Bearer token. The app then
      # retries pending webhook deliveries. The correlation id "gha-<run id>" finds this call in the logs.
      - name: Dispatch
        if: env.APP_URL != '' && env.DISPATCH_TOKEN != ''
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-Correlation-Id: gha-${{ github.run_id }}" \
            "$APP_URL/api/v1/internal/events/dispatch"
