openapi: 3.1.0
info:
  title: Wellbeing Campus Counselling API (Team 16)
  version: 2.0.0
  summary: Anonymous counselling requests with a Private Access Key and a mandatory 15-minute privacy buffer.
  description: |
    The shared contract for the web app, from `docs/PRD.md` section 5. Anything that goes beyond the PRD
    is marked **Added to the PRD**, and `docs/BACKEND-HANDOFF.md` explains why.

    Conventions:

    - Every path is under `/api/v1`. Every response echoes `X-Correlation-Id` (generated if absent, or if
      it is not 8-128 characters of `A-Z a-z 0-9 _ . : -`).
    - Students never sign in. They hold a Private Access Key (`WB-XXXX-XXXX-XXXX`), shown once.
    - Staff sign in through `POST /session`, which sets an HttpOnly cookie, or send `Authorization: Bearer`.
      Cookie-authenticated writes must come from the app's own origin.
    - **Non-enumeration:** a wrong key and an unknown record return the same `404 {"error":"not_found"}`.
      A staff role calling an operation outside its role gets that same 404.
    - Times are ISO-8601 UTC (`2026-11-10T03:00:00Z`). `date` parameters and opening hours are campus time (UTC+7).
    - Errors are `{"error":"<code>"}`, and a validation failure also lists field names. Submitted values are never echoed.
    - **Added to the PRD:** Team 14's Helpdesk sends referrals to the `/referrals` operations with its own bearer
      token (`helpdeskBearer`). These and `/practitioner/referrals` answer `404 {"error":"not_found"}` to every
      caller while the feature is off. A referral holds only a random `ref`, a service and the consent time, and
      is never linked to an appointment request.
servers:
  - url: https://wellbeing-intake.vercel.app/api/v1
    description: Deployed demo, seeded data only
  - url: http://localhost:3000/api/v1
    description: Local development
tags:
  - name: Student
    description: Public and anonymous
  - name: Practitioner
    description: Schedule and triage desk
  - name: Administrator
    description: Service categories and opening hours
  - name: Platform
    description: Health, staff sign-in, and machine routes
  - name: Helpdesk
    description: Referrals from Team 14's Helpdesk server (machine to machine)
paths:
  /health:
    get:
      tags: [Platform]
      summary: Liveness and readiness
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service and database are up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database is unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /services:
    get:
      tags: [Student]
      summary: PRD 1. Active counselling services
      operationId: listServices
      security: []
      responses:
        "200":
          description: Active services, ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
  /slots:
    get:
      tags: [Student]
      summary: PRD 2. Slots of one service on one campus date
      description: |
        Returns the day's slots as Available or Unavailable and nothing else. A slot is unavailable if it is
        past, beyond the booking horizon, or if the session or its buffer would touch a live request or that
        request's buffer. The reason is never revealed. Gaps between slots are the privacy buffer.
      operationId: listSlots
      security: []
      parameters:
        - { name: service_id, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, description: "YYYY-MM-DD, campus time", schema: { type: string, format: date } }
      responses:
        "200":
          description: The day's slots. Empty when the centre is closed that day.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Slot" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
  /requests:
    post:
      tags: [Student]
      summary: PRD 3. Submit an anonymous appointment request
      description: |
        No sign-in. Fields outside this schema are rejected, so the request cannot carry an email, legal name
        or student id. The access key in the response is shown once and cannot be recovered later.

        Urgency: the request is `URGENT` if the AI, the urgency phrases, or the student's `manual_urgency` says
        so. Nothing lowers the student's own choice. The AI is only used when `ai_opt_in` is true, and any AI
        problem falls back to the phrases and the student's choice without blocking the request.
      operationId: createRequest
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            **Added to the PRD.** A UUID generated once per form. A retry with the same key returns the same
            request and access key with `200`, so a double-click or a lost response cannot strand a student.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewRequest" }
      responses:
        "201":
          description: Created. Status is `PENDING`, and the slot and its buffer are now held.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestReceipt" }
        "200":
          description: A retry with the same `Idempotency-Key`. Same request, same access key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestReceipt" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409":
          description: The time was taken or is out of range. Includes that day's refreshed slots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlotUnavailable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /requests/me:
    get:
      tags: [Student]
      summary: PRD 4. Check a request with the Private Access Key
      description: |
        The PRD's `?access_key=` works, but hosting providers log full URLs, so the web app should send the
        `X-Access-Key` header (**Added to the PRD**). Failed attempts are limited per address.
      operationId: getMyRequest
      security: []
      parameters:
        - { name: access_key, in: query, required: false, schema: { type: string } }
        - { name: X-Access-Key, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentRequestWithKey" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /requests/{id}/cancel:
    post:
      tags: [Student]
      summary: PRD 5. Cancel anonymously with the access key
      description: Releases the slot and its buffer immediately. Repeating it changes nothing.
      operationId: cancelRequest
      security: []
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [access_key]
              properties:
                access_key: { type: string, examples: ["WB-7K3M-9QXP-2ZTF"] }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { const: CANCELLED }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`invalid_transition` (it was rejected) or `too_late` (the session has started)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /requests/{id}/status:
    patch:
      tags: [Practitioner]
      summary: PRD 7. Approve, reschedule, reject, or cancel
      description: |
        - Approve: `{"status":"CONFIRMED"}`
        - Reschedule: `{"status":"CONFIRMED","requested_slot_start":"..."}` (**Added to the PRD**). Also confirms a pending request.
        - Reject: `{"status":"REJECTED"}`, from `PENDING` only.
        - Cancel: `{"status":"CANCELLED"}` (**Added to the PRD**), from `PENDING` or `CONFIRMED`.

        Rejecting or cancelling releases the time. Repeating a decision changes nothing and sends no second
        event. Confirming or rescheduling publishes `appointment.confirmed`; cancelling a confirmed appointment
        publishes `appointment.cancelled`.
      operationId: decideRequest
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [CONFIRMED, REJECTED, CANCELLED] }
                requested_slot_start: { type: string, format: date-time, description: "With CONFIRMED only. Must be a real, free slot of this request's service." }
      responses:
        "200":
          description: The updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentRequest" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`invalid_transition` or `slot_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /practitioner/queue:
    get:
      tags: [Practitioner]
      summary: PRD 6. Requests waiting for a decision
      description: "`PENDING` requests, `URGENT` pinned first, then the soonest requested time. Access keys are never included."
      operationId: getQueue
      responses:
        "200":
          description: The queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppointmentRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /practitioner/schedule:
    get:
      tags: [Practitioner]
      summary: Added to the PRD. Timeline data for Screen 3
      description: |
        `PENDING` and `CONFIRMED` sessions in a date range, in time order. Draw each session from
        `requested_slot_start` to `requested_slot_end`, then the buffer block up to `privacy_buffer_end`.
      operationId: getSchedule
      parameters:
        - { name: from, in: query, required: false, description: "YYYY-MM-DD, campus time. Default: today.", schema: { type: string, format: date } }
        - { name: to, in: query, required: false, description: "YYYY-MM-DD, campus time. Default: 7 days from `from`. At most 31 days.", schema: { type: string, format: date } }
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppointmentRequest" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /practitioner/referrals:
    get:
      tags: [Practitioner]
      summary: Added to the PRD. Referrals from Team 14's Helpdesk
      description: |
        Practitioners and admins. At most 200, `received` first, then the newest. Each holds only Helpdesk's random
        `ref`, the service, the consent time and our own timestamps. While the feature is off every caller gets
        `404`, so the desk hides its Helpdesk referrals tab.
      operationId: listReferrals
      responses:
        "200":
          description: The referrals
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: "#/components/schemas/Referral" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /practitioner/referrals/{ref}:
    patch:
      tags: [Practitioner]
      summary: Added to the PRD. Accept or decline a Helpdesk referral
      description: |
        Practitioners and admins. Only a `received` referral can be decided. Repeating the same decision returns
        `200` and sends nothing new; the other decision is `409`. A decision queues one
        `wellbeing.referral_status` callback to Helpdesk, which we try to send at once. `approved` means we accept
        the referral, not that a session happened: the student still books anonymously.
      operationId: decideReferral
      parameters:
        - { $ref: "#/components/parameters/Ref" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [approved, declined] }
      responses:
        "200":
          description: The updated referral
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Referral" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`invalid_transition`: it was already decided the other way"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: invalid_transition }
  /triage/assess:
    post:
      tags: [Student]
      summary: Added to the PRD. AI suggestion for Screen 2's widget
      description: |
        Sends the note to the AI provider, so the web app must only call this after the student chooses AI.
        Nothing is stored or logged. If the AI is off or fails, this still answers from the urgency phrases
        with `triage_mode: DETERMINISTIC_FALLBACK`. This is a suggestion: `POST /requests` makes the final decision.
      operationId: assessUrgency
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intake_note]
              properties:
                intake_note: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: The suggestion, with fixed safety wording
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [urgency_level, triage_mode]
                    properties:
                      urgency_level: { $ref: "#/components/schemas/Urgency" }
                      triage_mode: { $ref: "#/components/schemas/TriageMode" }
                  - { $ref: "#/components/schemas/Guidance" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /finder/suggest:
    post:
      tags: [Student]
      summary: Added to the PRD. Optional service suggestion for the home page helper
      description: |
        Service navigation only: not a diagnosis, and not an urgency assessment (that is `POST /triage/assess`).
        The description goes to the AI provider, so the web app sends it only after the student consents, and
        `ai_opt_in` must be `true` or nothing runs. Nothing is stored, and the text is never logged.
        Recommendations only ever name services that are active right now, best first, at most two.
        A crisis phrase returns `urgent_guidance: true` with no recommendations, without calling the AI; the page
        then points to its fixed emergency contacts. If the AI is off, skipped or fails, a keyword matcher answers
        with `mode: DETERMINISTIC_FALLBACK`, and an empty list when nothing clearly fits. Booking never depends on this.
      operationId: suggestServices
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, ai_opt_in]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
                ai_opt_in: { const: true, description: The student's consent to send the text to the AI provider. }
            example: { text: Exams are affecting my sleep and I feel overwhelmed., ai_opt_in: true }
      responses:
        "200":
          description: Up to two suggested services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSuggestions" }
              example:
                mode: AI_ASSISTED
                urgent_guidance: false
                recommendations:
                  - { service_id: srv_academic_stress, reason_code: STUDY_SUPPORT }
                  - { service_id: srv_general_counselling, reason_code: GENERAL_SUPPORT }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/services:
    get:
      tags: [Administrator]
      summary: Added to the PRD. All services, including inactive ones
      operationId: adminListServices
      responses:
        "200":
          description: All services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/services/{id}:
    patch:
      tags: [Administrator]
      summary: Added to the PRD. Configure a service category
      description: Requests already made keep their times.
      operationId: adminUpdateService
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                is_active: { type: boolean }
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                duration_minutes: { type: integer, minimum: 15, maximum: 120, multipleOf: 5 }
      responses:
        "200":
          description: The updated service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`name_exists`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/availability:
    get:
      tags: [Administrator]
      summary: Added to the PRD. Weekly opening hours of the shared calendar
      operationId: adminGetAvailability
      responses:
        "200":
          description: The week
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Administrator]
      summary: Added to the PRD. Replace the weekly opening hours
      description: Replaces the whole week at once. Requests already made keep their times.
      operationId: adminSetAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Availability" }
      responses:
        "200":
          description: The week as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
  /session:
    post:
      tags: [Platform]
      summary: Staff sign-in
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Signed in. Sets HttpOnly session cookies.
          content:
            application/json:
              schema:
                type: object
                required: [ok, accessToken, expiresAt]
                properties:
                  ok: { const: true }
                  accessToken: { type: string, description: For API clients. The web app should use the cookie. }
                  expiresAt: { type: integer }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: "`invalid_credentials`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [Platform]
      summary: Staff sign-out
      operationId: signOut
      security: []
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
  /me:
    get:
      tags: [Platform]
      summary: The signed-in staff member
      description: Lets the UI pick a screen. A `401` means nobody is signed in. Students never call this.
      operationId: getMe
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                type: object
                required: [id, role, displayName]
                properties:
                  id: { type: string, format: uuid }
                  role: { type: string, enum: [practitioner, admin] }
                  displayName: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /internal/events/dispatch:
    post:
      tags: [Platform]
      summary: Retry pending webhook deliveries
      description: |
        Machine credential only. Called on a schedule, which also keeps the database awake. It also sends the
        Helpdesk referral callbacks that are due and deletes referrals older than 30 days.
      operationId: dispatchEvents
      security:
        - machineToken: []
      responses:
        "200":
          description: Counts only
          content:
            application/json:
              schema:
                type: object
                required: [claimed, delivered, retrying, parked, referrals, referrals_purged]
                properties:
                  claimed: { type: integer }
                  delivered: { type: integer }
                  retrying: { type: integer }
                  parked: { type: integer }
                  referrals:
                    type: object
                    description: "**Added to the PRD.** Callbacks to Team 14's Helpdesk. `skipped` is true while referrals are off or the callback URL or secret is missing."
                    required: [skipped, sent, retry, gaveUp]
                    properties:
                      skipped: { type: boolean }
                      sent: { type: integer }
                      retry: { type: integer }
                      gaveUp: { type: integer }
                  referrals_purged: { type: integer, description: "**Added to the PRD.** Referrals deleted because they arrived more than 30 days ago." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /webhooks/notification-hub:
    post:
      tags: [Platform]
      summary: Delivery receipts from the Notification Hub
      description: Signature is verified over the raw body. Idempotent on `eventId`.
      operationId: receiveReceipt
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, type, occurredAt, source, subject, data]
              properties:
                eventId: { type: string, format: uuid }
                type: { type: string, enum: [notification.delivered, notification.failed] }
                occurredAt: { type: string, format: date-time }
                source: { type: string }
                subject: { type: string }
                data:
                  type: object
                  properties:
                    reference: { type: string, description: The request id from the webhook }
      responses:
        "200":
          description: Received. A duplicate is acknowledged, not reprocessed.
          content:
            application/json:
              schema:
                type: object
                required: [received, duplicate]
                properties:
                  received: { const: true }
                  duplicate: { type: boolean }
        "400":
          description: "`invalid_envelope`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "`invalid_signature`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /referrals:
    post:
      tags: [Helpdesk]
      summary: Added to the PRD. Receive a referral from Team 14's Helpdesk
      description: |
        Helpdesk sends this after the student ticks the consent box. Fields outside this schema are rejected, so a
        referral cannot carry a name, email, student id or ticket text. Sending the same `ref` again changes
        nothing and answers `200` with its current status. Limited to 60 calls per 10 minutes per address.
        `404` for every caller while the feature is off.
      operationId: createReferral
      security:
        - helpdeskBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewReferral" }
            example: { ref: hd-3f9a0c71b2e84d0612ab34cd56ef7890, service_id: srv_academic_stress, consent_at: "2026-11-10T03:00:00Z" }
      responses:
        "201":
          description: Received. Status is `received`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralReceipt" }
        "200":
          description: We already have this `ref`. Nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralReceipt" }
        "400":
          description: |
            `invalid_json`, or `validation_failed` with field names. `consent_at` more than 5 minutes in the future
            or more than 30 days old, and a `service_id` we do not have, are also `validation_failed`.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [invalid_json, validation_failed] }
                  fields: { type: array, items: { type: string }, examples: [["consent_at"]] }
        "401": { $ref: "#/components/responses/HelpdeskUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /referrals/{ref}:
    get:
      tags: [Helpdesk]
      summary: Added to the PRD. The status of one referral
      description: Only the status. `404` for an unknown or badly formed `ref`, and for every caller while the feature is off.
      operationId: getReferralStatus
      security:
        - helpdeskBearer: []
      parameters:
        - { $ref: "#/components/parameters/Ref" }
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { $ref: "#/components/schemas/ReferralStatus" }
        "401": { $ref: "#/components/responses/HelpdeskUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Helpdesk]
      summary: Added to the PRD. The student withdrew, so delete the referral
      description: |
        Deletes the referral and any callback still waiting for it. Idempotent: a `ref` we do not have also answers
        `200`. `404` for a badly formed `ref`, and for every caller while the feature is off.
      operationId: deleteReferral
      security:
        - helpdeskBearer: []
      parameters:
        - { $ref: "#/components/parameters/Ref" }
      responses:
        "200":
          description: Deleted, or it was not there
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: { const: true }
        "401": { $ref: "#/components/responses/HelpdeskUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
webhooks:
  appointment.confirmed:
    post:
      summary: PRD section 6. A practitioner confirmed or rescheduled a request
      description: |
        Sent to the Notification Hub. The body is exactly these four fields: no alias, note, urgency or service.
        Headers: `X-Event-Id` (stable across retries; de-duplicate on it), `X-Signature`, `X-Signature-Timestamp`,
        `X-Correlation-Id`. The signature is `sha256=<hex>` of the HMAC-SHA256 of `<timestamp>.<raw body>`;
        reject timestamps older than 5 minutes. After a reschedule, the event with the latest time wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_type, appointment_id, scheduled_time, privacy_buffer_end]
              properties:
                event_type: { const: appointment.confirmed }
                appointment_id: { type: string, examples: ["req_3f9a0c71b2e84d06"] }
                scheduled_time: { type: string, format: date-time, examples: ["2026-11-10T03:00:00Z"] }
                privacy_buffer_end: { type: string, format: date-time, examples: ["2026-11-10T04:00:00Z"] }
      responses:
        "202": { description: Accepted. Any 2xx counts as delivered. Anything else is retried with backoff. }
  appointment.cancelled:
    post:
      summary: Added to the PRD. A confirmed appointment was cancelled
      description: Same delivery rules. Drop any pending reminder for this `appointment_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_type, appointment_id]
              properties:
                event_type: { const: appointment.cancelled }
                appointment_id: { type: string }
      responses:
        "202": { description: Accepted. }
  wellbeing.referral_status:
    post:
      summary: Added to the PRD. A practitioner accepted or declined a Helpdesk referral
      description: |
        Sent to Team 14's Helpdesk at `HELPDESK_WEBHOOK_URL` (default `<HELPDESK_API_BASE_URL>/webhooks/wellbeing`).
        The body is exactly `{"eventId","type","data":{"ref","status"}}`: never a time, counsellor, note or anything
        about a session. Headers: `X-Timestamp` (Unix seconds), `X-Signature` (lowercase hex HMAC-SHA256 of
        `<timestamp>.<raw body>` with `HELPDESK_WEBHOOK_SECRET`) and `X-Correlation-Id`. Any 2xx counts as delivered;
        another 4xx is not retried; a 5xx, timeout or network error is retried with backoff (same `eventId` and
        body), up to 8 attempts. De-duplicate on `eventId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [eventId, type, data]
              properties:
                eventId: { type: string, examples: ["evt-6f1c2d3e-4b5a-4c7d-8e9f-0a1b2c3d4e5f"] }
                type: { const: wellbeing.referral_status }
                data:
                  type: object
                  additionalProperties: false
                  required: [ref, status]
                  properties:
                    ref: { $ref: "#/components/schemas/ReferralRef" }
                    status: { type: string, enum: [approved, declined] }
      responses:
        "200": { description: Received. Any 2xx counts as delivered. }
components:
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      description: A staff access token from `POST /session`.
    staffCookie:
      type: apiKey
      in: cookie
      name: sb-auth-token
      description: The HttpOnly session cookie set by `POST /session`.
    machineToken:
      type: http
      scheme: bearer
      description: The scoped `DISPATCH_TOKEN`.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
    helpdeskBearer:
      type: http
      scheme: bearer
      description: The `HELPDESK_REFERRAL_TOKEN` we gave Team 14's Helpdesk privately. Only for the `/referrals` operations.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, examples: ["req_3f9a0c71b2e84d06"] }
    Ref:
      name: ref
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ReferralRef" }
  responses:
    NotFound:
      description: Absent, not yours, or a wrong key. All are identical.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: not_found }
    Unauthenticated:
      description: No valid staff credential
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unauthenticated }
    HelpdeskUnauthenticated:
      description: Missing or wrong Helpdesk token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unauthenticated }
    CrossOrigin:
      description: A cookie-authenticated write from another origin
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: cross_origin_rejected }
    TooManyRequests:
      description: An abuse limit was reached. Try again later.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: too_many_requests }
    ValidationFailed:
      description: Invalid input. Field names only; values are never echoed.
      content:
        application/json:
          schema:
            type: object
            required: [error, fields]
            properties:
              error: { const: validation_failed }
              fields: { type: array, items: { type: string } }
    ServiceUnavailable:
      description: The service catalogue could not be read. Students can still browse and book once it is back.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: service_unavailable }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Health:
      type: object
      required: [status, service, version, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { const: wellbeing }
        version: { type: string }
        database: { type: string, enum: [up, down] }
    Urgency:
      type: string
      enum: [ROUTINE, URGENT]
    TriageMode:
      type: string
      enum: [AI_ASSISTED, DETERMINISTIC_FALLBACK]
    Status:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED, CANCELLED]
    Service:
      type: object
      required: [id, name, description, duration_minutes, is_active]
      properties:
        id: { type: string, description: "Stable: it survives a reseed.", examples: ["srv_academic_stress"] }
        name: { type: string, examples: ["Academic Stress Counselling"] }
        description: { type: string, description: "**Added to the PRD**, for the category view." }
        duration_minutes: { type: integer, examples: [45] }
        is_active: { type: boolean }
    Slot:
      type: object
      required: [slot_start, slot_end, is_available]
      properties:
        slot_start: { type: string, format: date-time, examples: ["2026-11-10T03:00:00Z"] }
        slot_end: { type: string, format: date-time, examples: ["2026-11-10T03:45:00Z"] }
        is_available: { type: boolean }
    SlotUnavailable:
      type: object
      required: [error, slots]
      properties:
        error: { const: slot_unavailable }
        slots:
          type: array
          items: { $ref: "#/components/schemas/Slot" }
    NewRequest:
      type: object
      additionalProperties: false
      required: [service_id, intake_note, requested_slot_start]
      properties:
        service_id: { type: string }
        alias: { type: [string, "null"], maxLength: 40, description: Optional. Empty means none. }
        intake_note: { type: string, minLength: 1, maxLength: 2000 }
        manual_urgency: { oneOf: [{ $ref: "#/components/schemas/Urgency" }, { type: "null" }] }
        requested_slot_start: { type: string, format: date-time, description: "`slot_start` of a slot from `GET /slots`." }
        ai_opt_in: { type: boolean, default: false, description: "**Added to the PRD.** The note goes to the AI provider only if true." }
    Guidance:
      type: object
      required: [disclaimer, emergency_links]
      properties:
        disclaimer: { type: string, description: "Fixed wording. Nothing a model wrote ever appears here." }
        # The two campus entries in emergency_links may come from Team 14 Helpdesk GET /contacts, labelled
        # "(demo)" while unverified. On any Helpdesk problem the built-in numbers are used. 1669 and 1323
        # are always built in.
        emergency_links:
          type: array
          items:
            type: object
            required: [name, detail, phone, href]
            properties:
              name: { type: string }
              detail: { type: string }
              phone: { type: string, examples: ["1323"] }
              href: { type: string, examples: ["tel:1323"] }
    ServiceSuggestions:
      type: object
      additionalProperties: false
      required: [mode, urgent_guidance, recommendations]
      properties:
        mode: { $ref: "#/components/schemas/TriageMode" }
        urgent_guidance:
          type: boolean
          description: True when the text suggests immediate danger. Recommendations are then always empty.
        recommendations:
          type: array
          maxItems: 2
          description: Active services only, best first, no repeats. Empty when nothing clearly fits.
          items:
            type: object
            additionalProperties: false
            required: [service_id, reason_code]
            properties:
              service_id: { type: string, minLength: 1, maxLength: 64 }
              reason_code:
                type: string
                enum: [STUDY_SUPPORT, GENERAL_SUPPORT, URGENT_SUPPORT, RELATED_SERVICE]
                description: Catalogue fit, not a diagnosis. The web app shows fixed wording for each code.
    RequestReceipt:
      allOf:
        - type: object
          required: [id, access_key, status, urgency_level, triage_mode, requested_slot_start, requested_slot_end, privacy_buffer_end]
          properties:
            id: { type: string, examples: ["req_3f9a0c71b2e84d06"] }
            access_key: { type: string, description: Shown once. It cannot be recovered later., examples: ["WB-7K3M-9QXP-2ZTF"] }
            status: { $ref: "#/components/schemas/Status" }
            urgency_level: { $ref: "#/components/schemas/Urgency" }
            triage_mode: { $ref: "#/components/schemas/TriageMode" }
            requested_slot_start: { type: string, format: date-time }
            requested_slot_end: { type: string, format: date-time }
            privacy_buffer_end: { type: string, format: date-time }
        - { $ref: "#/components/schemas/Guidance" }
    AppointmentRequest:
      type: object
      description: The PRD's model. Staff responses never include the access key.
      required: [id, service_id, alias, intake_note, urgency_level, triage_mode, requested_slot_start, requested_slot_end, privacy_buffer_end, status]
      properties:
        id: { type: string }
        service_id: { type: string }
        alias: { type: [string, "null"] }
        intake_note: { type: string }
        urgency_level: { $ref: "#/components/schemas/Urgency" }
        triage_mode: { $ref: "#/components/schemas/TriageMode" }
        requested_slot_start: { type: string, format: date-time }
        requested_slot_end: { type: string, format: date-time }
        privacy_buffer_end: { type: string, format: date-time, description: "**Added to the PRD**, for drawing the buffer block." }
        status: { $ref: "#/components/schemas/Status" }
    AppointmentRequestWithKey:
      allOf:
        - { $ref: "#/components/schemas/AppointmentRequest" }
        - type: object
          required: [access_key]
          properties:
            access_key: { type: string }
    Availability:
      type: object
      additionalProperties: false
      required: [windows]
      properties:
        windows:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [weekday, start_time, end_time]
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday. }
              start_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", examples: ["09:00"] }
              end_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", examples: ["17:00"] }
    ReferralRef:
      type: string
      pattern: "^hd-[0-9a-f]{32}$"
      description: Helpdesk's random reference. It means nothing to us and is never linked to a booking.
      examples: ["hd-3f9a0c71b2e84d0612ab34cd56ef7890"]
    ReferralStatus:
      type: string
      enum: [received, approved, declined]
      description: "`received` waits for review. `approved` means we accept the referral, not that a session happened."
    NewReferral:
      type: object
      additionalProperties: false
      required: [ref, service_id, consent_at]
      properties:
        ref: { $ref: "#/components/schemas/ReferralRef" }
        service_id:
          type: [string, "null"]
          pattern: "^srv_[a-z0-9_]+$"
          maxLength: 64
          description: One of our service ids from `GET /services`, or null when the student did not pick one.
          examples: ["srv_academic_stress"]
        consent_at:
          type: string
          format: date-time
          description: When the student consented, with a time zone. At most 5 minutes in the future and at most 30 days old.
    ReferralReceipt:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { $ref: "#/components/schemas/ReferralRef" }
        status: { $ref: "#/components/schemas/ReferralStatus" }
    Referral:
      type: object
      additionalProperties: false
      description: Everything we store about a referral. There is no name, email, student id or ticket text.
      required: [ref, service_id, consent_at, status, received_at, decided_at]
      properties:
        ref: { $ref: "#/components/schemas/ReferralRef" }
        service_id: { type: [string, "null"], examples: ["srv_academic_stress"] }
        consent_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ReferralStatus" }
        received_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time, description: Null while `received`. }
security:
  - staffBearer: []
  - staffCookie: []
